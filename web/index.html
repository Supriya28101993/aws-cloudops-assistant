<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS CloudOps Assistant</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#6b7280; --accent:#2563eb; --user:#2563eb; --bot:#eef1f7; --border:#e3e6ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; height:100vh; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .cfg { display:flex; gap:8px; margin-bottom:12px; }
  .cfg input { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { border:1px solid var(--border); background:var(--card); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  #chat { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; margin:8px 0; white-space:pre-wrap; line-height:1.45; font-size:15px; }
  .user { background:var(--user); color:#fff; margin-left:auto; }
  .bot { background:var(--bot); }
  .src { display:block; margin-top:6px; font-size:12px; color:var(--muted); }
  form { display:flex; gap:8px; margin-top:12px; }
  form input { flex:1; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:15px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>☁️ AWS CloudOps Assistant</h1>
  <div class="sub">Troubleshooting answers from your team's AWS runbooks, via Amazon Bedrock Knowledge Bases.</div>

  <div class="cfg">
    <input id="url" placeholder="Paste your Lambda Function URL (https://....lambda-url.us-east-1.on.aws/)">
  </div>

  <div class="chips">
    <span class="chip">I cannot SSH into my EC2 instance</span>
    <span class="chip">How do I rotate IAM access keys?</span>
    <span class="chip">Why did our S3 bill increase?</span>
    <span class="chip">My Lambda function is timing out</span>
    <span class="chip">What tags are mandatory?</span>
  </div>

  <div id="chat"></div>

  <form id="f">
    <input id="q" placeholder="Ask about EC2, IAM, S3, RDS, Lambda, tagging..." autocomplete="off">
    <button id="send">Send</button>
  </form>
</div>

<script>
  const urlBox = document.getElementById("url");
  const chat = document.getElementById("chat");
  const q = document.getElementById("q");
  const send = document.getElementById("send");

  // Remember the URL in this browser only, so it never ends up in the code or on GitHub
  try { urlBox.value = localStorage.getItem("fnUrl") || ""; } catch (e) {}
  urlBox.addEventListener("change", () => { try { localStorage.setItem("fnUrl", urlBox.value.trim()); } catch (e) {} });

  function add(role, text, sources) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (sources && sources.length) {
      const s = document.createElement("span");
      s.className = "src";
      s.textContent = "Source: " + sources.join(", ");
      div.appendChild(s);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function ask(question) {
    // Tidy up common paste mistakes: spaces, a doubled "https://", or a missing one
    let url = urlBox.value.trim().replace(/\s+/g, "").replace(/^(https?:\/\/)+/i, "");
    if (url) { url = "https://" + url; urlBox.value = url; try { localStorage.setItem("fnUrl", url); } catch (e) {} }
    if (!url) { add("bot", "Please paste your Lambda Function URL at the top first."); return; }
    add("user", question);
    const thinking = add("bot", "Searching runbooks...");
    send.disabled = true;
    try {
      const res = await fetch(url, {
        method: "POST",
        // text/plain avoids a CORS preflight; the Lambda still parses the body as JSON
        headers: { "content-type": "text/plain" },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      thinking.remove();
      if (data.error) add("bot", "Error: " + data.error);
      else add("bot", data.answer || data.response || JSON.stringify(data), data.sources || data.citations);
    } catch (e) {
      thinking.remove();
      add("bot", "Could not reach the function: " + e.message + "\nCheck the URL and that CORS allows POST and content-type.");
    }
    send.disabled = false;
  }

  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (text) { q.value = ""; ask(text); }
  });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => ask(c.textContent)));
</script>
</body>
</html>
